<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style1.css">
    <title>Cdastro-CSS</title>
</head>
<body>
    <h1 class="h1">Login</h1>

    <div class="division">
        <ul>
            <li>
                <a href="./cadastros.html">
                   <i class="bi bi-house-door"></i>
                   <i class="bi bi-house-door-fill activeIcon"></i>
                </a>
            </li>

            <li  class="active-list">
                <a href="./index.html" target="_blank">
                    <i class="bi bi-person"></i>
                    <i class="bi bi-person-fill activeIcon"></i>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="bi bi-heart"></i>
                    <i class="bi bi-heart-fill activeIcon"></i>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="bi bi-clipboard"></i>
                    <i class="bi bi-clipboard-fill activeIcon"></i>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="bi bi-gear"></i>
                    <i class="bi bi-gear-fill activeIcon"></i>
                </a>
            </li>

            <div class="indicator"></div>

        </ul>
    </div>

     <div class="division-two">
        <h1 class="cadastro">Cadastrar</h1>
        <form>
            <input type="text" placeholder="Nome Completo" required class="inp">
            <input type="email" placeholder="Email" required class="inp-2">
            <input type="password" placeholder="Senha" required class="inp-3">
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>

</html>
